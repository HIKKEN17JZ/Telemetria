services:
  postgres:
    image: postgres:15-alpine
    container_name: telemetria_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telemetria}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-telemetria}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - telemetria_net

  redis:
    image: redis:7-alpine
    container_name: telemetria_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - telemetria_net

volumes:
  postgres_data:
    name: telemetria_postgres_data
  redis_data:
    name: telemetria_redis_data

networks:
  telemetria_net:
    name: telemetria_net
    driver: bridge
